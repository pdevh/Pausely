name: Release Builds

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-macos:
    runs-on: macos-latest
    concurrency:
      group: release-macos-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Import persistent self-signed certificate
        timeout-minutes: 2
        env:
          MACOS_SIGNING_CERTIFICATE: ${{ secrets.MACOS_SIGNING_CERTIFICATE }}
          MACOS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          test -n "$MACOS_SIGNING_CERTIFICATE"
          test -n "$MACOS_SIGNING_CERTIFICATE_PASSWORD"

          CERTIFICATE_PATH="$RUNNER_TEMP/pausely-release-signing.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/pausely-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          PUBLIC_CERTIFICATE=".github/signing/Pausely-Release-Certificate.pem"

          printf '%s' "$MACOS_SIGNING_CERTIFICATE" | base64 -D > "$CERTIFICATE_PATH"
          echo "Creating isolated signing keychain"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          echo "Importing persistent signing identity"
          security import "$CERTIFICATE_PATH" -P "$MACOS_SIGNING_CERTIFICATE_PASSWORD" -f pkcs12 -k "$KEYCHAIN_PATH" -A
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          echo "Applying temporary noninteractive admin trust"
          sudo -n security add-trusted-cert \
            -d \
            -r trustRoot \
            -p codeSign \
            -k /Library/Keychains/System.keychain \
            "$PUBLIC_CERTIFICATE"
          security list-keychains -d user -s "$KEYCHAIN_PATH"

          CERTIFICATE_SHA1="$(openssl x509 -in "$PUBLIC_CERTIFICATE" -noout -fingerprint -sha1 | cut -d= -f2 | tr -d ':')"
          SIGNING_IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | awk '/Pausely GitHub Release Signing/{print $2; exit}')"
          test -n "$SIGNING_IDENTITY"
          test "$SIGNING_IDENTITY" = "$CERTIFICATE_SHA1"
          test "$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -c 'Pausely GitHub Release Signing')" -eq 1

          echo "CODE_SIGN_IDENTITY=$SIGNING_IDENTITY" >> "$GITHUB_ENV"
          echo "CODE_SIGN_KEYCHAIN=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "CODE_SIGN_CERTIFICATE_SHA1=$CERTIFICATE_SHA1" >> "$GITHUB_ENV"
          echo "PAUSELY_SIGNING_CERTIFICATE_SHA1=$(printf '%s' "$CERTIFICATE_SHA1" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Build macOS app
        env:
          VERSION: 1.0.${{ github.run_number }}
          REQUIRE_STABLE_SIGNING: true
        run: |
          chmod +x build.sh
          ./build.sh "$VERSION"

      - name: Verify macOS bundle
        env:
          VERSION: 1.0.${{ github.run_number }}
        run: |
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Pausely.app/Contents/Info.plist)" = "$VERSION"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' Pausely.app/Contents/Info.plist)" = "$VERSION"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' Pausely.app/Contents/Info.plist)" = "Pausely.icns"
          test -s Pausely.app/Contents/Resources/Pausely.icns
          cmp -s Pausely.icns Pausely.app/Contents/Resources/Pausely.icns
          test "$(lipo -archs Pausely.app/Contents/MacOS/Pausely)" = "x86_64 arm64" || test "$(lipo -archs Pausely.app/Contents/MacOS/Pausely)" = "arm64 x86_64"
          codesign --verify --deep --strict Pausely.app
          ! codesign -dv --verbose=4 Pausely.app 2>&1 | grep -q '^Signature=adhoc$'
          codesign -dv --verbose=4 Pausely.app 2>&1 | grep -q '^Authority=Pausely GitHub Release Signing$'

          EXPECTED_REQUIREMENT="identifier \"com.philipp.Pausely\" and certificate leaf = H\"$PAUSELY_SIGNING_CERTIFICATE_SHA1\""
          ACTUAL_REQUIREMENT="$(codesign -d -r- Pausely.app 2>&1 | sed -n 's/^designated => //p')"
          test "$ACTUAL_REQUIREMENT" = "$EXPECTED_REQUIREMENT"
          codesign --verify --strict --verbose=4 -R="$EXPECTED_REQUIREMENT" Pausely.app

      - name: Package macOS update archive
        run: ditto -c -k --sequesterRsrc --keepParent Pausely.app Pausely-macOS.zip

      - name: Create drag-to-Applications DMG
        run: |
          DMG_ROOT="$(mktemp -d "$RUNNER_TEMP/pausely-dmg.XXXXXX")"
          /usr/bin/ditto Pausely.app "$DMG_ROOT/Pausely.app"
          ln -s /Applications "$DMG_ROOT/Applications"
          hdiutil create \
            -volname "Pausely" \
            -srcfolder "$DMG_ROOT" \
            -format UDZO \
            -ov \
            -nospotlight \
            Pausely-macOS.dmg

      - name: Verify macOS DMG
        env:
          VERSION: 1.0.${{ github.run_number }}
        run: |
          hdiutil verify Pausely-macOS.dmg
          MOUNT_POINT="$(mktemp -d "$RUNNER_TEMP/pausely-mount.XXXXXX")"
          trap 'hdiutil detach "$MOUNT_POINT" 2>/dev/null || true' EXIT
          hdiutil attach \
            -readonly \
            -nobrowse \
            -noautoopen \
            -mountpoint "$MOUNT_POINT" \
            Pausely-macOS.dmg

          test -d "$MOUNT_POINT/Pausely.app"
          test -L "$MOUNT_POINT/Applications"
          test "$(readlink "$MOUNT_POINT/Applications")" = "/Applications"
          test "$(find "$MOUNT_POINT" -mindepth 1 -maxdepth 1 -name 'Pausely.app' -print | wc -l | tr -d ' ')" = "1"

          EXPECTED_REQUIREMENT="identifier \"com.philipp.Pausely\" and certificate leaf = H\"$PAUSELY_SIGNING_CERTIFICATE_SHA1\""
          codesign --verify --deep --strict "$MOUNT_POINT/Pausely.app"
          codesign --verify --strict --verbose=4 -R="$EXPECTED_REQUIREMENT" "$MOUNT_POINT/Pausely.app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$MOUNT_POINT/Pausely.app/Contents/Info.plist")" = "$VERSION"
          test "$(lipo -archs "$MOUNT_POINT/Pausely.app/Contents/MacOS/Pausely")" = "x86_64 arm64" || test "$(lipo -archs "$MOUNT_POINT/Pausely.app/Contents/MacOS/Pausely")" = "arm64 x86_64"

          hdiutil detach "$MOUNT_POINT"
          trap - EXIT

      - name: Generate release notes
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: 1.0.${{ github.run_number }}
        run: |
          mkdir sparkle-release
          cp Pausely-macOS.zip sparkle-release/Pausely-macOS.zip
          gh api --method POST "/repos/${GITHUB_REPOSITORY}/releases/generate-notes" -f tag_name="v${VERSION}" -f target_commitish="${GITHUB_SHA}" --jq .body > sparkle-release/Pausely-macOS.md

      - name: Generate signed Sparkle appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          VERSION: 1.0.${{ github.run_number }}
        run: |
          test -n "$SPARKLE_PRIVATE_KEY"
          printf '%s' "$SPARKLE_PRIVATE_KEY" | .build/artifacts/sparkle/Sparkle/bin/generate_appcast \
            --ed-key-file - \
            --download-url-prefix "https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}/" \
            --link "https://github.com/${GITHUB_REPOSITORY}/releases/tag/v${VERSION}" \
            --embed-release-notes \
            --maximum-versions 1 \
            --maximum-deltas 0 \
            -o appcast.xml \
            sparkle-release
          test -s appcast.xml

      - name: Verify appcast contents
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          VERSION: 1.0.${{ github.run_number }}
        run: |
          grep -q "<sparkle:version>$VERSION</sparkle:version>" appcast.xml
          grep -q "releases/download/v${VERSION}/Pausely-macOS.zip" appcast.xml
          ! grep -q "Pausely-macOS.dmg" appcast.xml
          grep -q "sparkle:edSignature=" appcast.xml
          grep -q "sparkle-signatures:" appcast.xml
          printf '%s' "$SPARKLE_PRIVATE_KEY" | .build/artifacts/sparkle/Sparkle/bin/sign_update \
            --verify \
            --ed-key-file - \
            appcast.xml

      - name: Upload macOS artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Pausely-macOS
          path: |
            Pausely-macOS.dmg
            Pausely-macOS.zip
            appcast.xml

      - name: Remove temporary signing material
        if: always()
        run: |
          # Hosted runners are destroyed after the job. Avoid the known-hanging
          # remove-trusted-cert API; this workflow must not run unchanged self-hosted.
          security delete-keychain "$RUNNER_TEMP/pausely-signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/pausely-release-signing.p12"

  build-windows:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-2025
    concurrency:
      group: release-windows-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
    env:
      VERSION: 1.0.${{ github.run_number }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x

      - name: Publish Windows app
        shell: pwsh
        run: |
          dotnet publish PauselyWindows/PauselyWindows.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -p:Version=$env:VERSION `
            -p:FileVersion=$env:VERSION `
            -o out

      - name: Verify Windows publish contents
        shell: pwsh
        run: |
          $files = @(Get-ChildItem out -File)
          if ($files.Count -ne 1 -or $files[0].Name -ne "PauselyWindows.exe") {
            throw "Expected only out/PauselyWindows.exe, found: $($files.Name -join ', ')"
          }

          Add-Type -AssemblyName System.Drawing
          $sourceIconPath = (Resolve-Path "PauselyWindows/Pausely.ico").Path
          $publishedExePath = (Resolve-Path "out/PauselyWindows.exe").Path
          $iconSize = [System.Drawing.Size]::new(32, 32)
          $sourceIcon = [System.Drawing.Icon]::new($sourceIconPath, $iconSize)
          $publishedIcon = [System.Drawing.Icon]::ExtractAssociatedIcon($publishedExePath)

          if ($null -eq $publishedIcon) {
            throw "Published executable does not contain an application icon"
          }

          $sourceBitmap = $sourceIcon.ToBitmap()
          $publishedBitmap = $publishedIcon.ToBitmap()
          try {
            if ($publishedBitmap.Width -ne 32 -or $publishedBitmap.Height -ne 32) {
              throw "Expected a 32x32 executable icon, got $($publishedBitmap.Width)x$($publishedBitmap.Height)"
            }

            $darkSurfacePixel = $sourceBitmap.GetPixel(3, 16)
            if ($darkSurfacePixel.A -lt 250 -or $darkSurfacePixel.R -ge 80 -or $darkSurfacePixel.G -ge 80 -or $darkSurfacePixel.B -ge 80) {
              throw "PauselyWindows/Pausely.ico does not contain the required opaque dark surface"
            }

            for ($y = 0; $y -lt 32; $y++) {
              for ($x = 0; $x -lt 32; $x++) {
                if ($sourceBitmap.GetPixel($x, $y).ToArgb() -ne $publishedBitmap.GetPixel($x, $y).ToArgb()) {
                  throw "Published executable icon differs from PauselyWindows/Pausely.ico at ($x, $y)"
                }
              }
            }
          }
          finally {
            $sourceBitmap.Dispose()
            $publishedBitmap.Dispose()
            $sourceIcon.Dispose()
            $publishedIcon.Dispose()
          }

      - name: Prepare persistent Windows signing identity
        timeout-minutes: 3
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERTIFICATE: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE }}
          WINDOWS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERTIFICATE) -or
              [string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERTIFICATE_PASSWORD)) {
            throw "The persistent Windows signing certificate secrets are missing."
          }

          $certificatePath = (
            Resolve-Path ".github/signing/Pausely-Windows-Release-Certificate.pem"
          ).Path
          $expectedCertificateSha256 =
            "75A3947C8623E4EAD6C840D11A64B9A303AA8929548B30F7B14AAED37018A1C7"
          $expectedCertificateSha1 = "E729BC983B9B5A1F145103066D43FC53A58D6C57"
          $pfxPath = Join-Path $env:RUNNER_TEMP "pausely-windows-release-signing.p12"
          "PAUSELY_WINDOWS_CERTIFICATE_SHA1=$expectedCertificateSha1" >> $env:GITHUB_ENV
          "PAUSELY_WINDOWS_SIGNING_PFX=$pfxPath" >> $env:GITHUB_ENV

          try {
            $pfxBytes = [Convert]::FromBase64String($env:WINDOWS_SIGNING_CERTIFICATE)
          }
          catch {
            throw "WINDOWS_SIGNING_CERTIFICATE is not valid base64."
          }
          [IO.File]::WriteAllBytes($pfxPath, $pfxBytes)

          Write-Host "Validating the pinned Windows signing identity"
          $publicCertificate =
            [Security.Cryptography.X509Certificates.X509Certificate2]::new(
              $certificatePath
            )
          $publicCertificateSha256 = [Convert]::ToHexString(
            [Security.Cryptography.SHA256]::HashData($publicCertificate.RawData)
          )
          if ($publicCertificateSha256 -ne $expectedCertificateSha256) {
            throw "The committed Windows release certificate does not match its pinned SHA-256 identity."
          }

          $pfxCertificates =
            [Security.Cryptography.X509Certificates.X509Certificate2Collection]::new()
          $pfxCertificates.Import(
            $pfxPath,
            $env:WINDOWS_SIGNING_CERTIFICATE_PASSWORD,
            [Security.Cryptography.X509Certificates.X509KeyStorageFlags]::EphemeralKeySet
          )
          $pfxSigningCertificate = $pfxCertificates |
            Where-Object { $_.HasPrivateKey } |
            Select-Object -First 1
          if ($null -eq $pfxSigningCertificate) {
            throw "The Windows signing P12 did not contain a private key."
          }

          $pfxCertificateSha256 = [Convert]::ToHexString(
            [Security.Cryptography.SHA256]::HashData($pfxSigningCertificate.RawData)
          )
          if ($pfxCertificateSha256 -ne $expectedCertificateSha256 -or
              $pfxSigningCertificate.Thumbprint -ne $expectedCertificateSha1) {
            throw "The Windows signing P12 does not match the committed release identity."
          }
          if ($pfxSigningCertificate.NotAfter.ToUniversalTime() -le [DateTime]::UtcNow) {
            throw "The Windows signing certificate has expired."
          }

          $codeSigningEku = "1.3.6.1.5.5.7.3.3"
          $hasCodeSigningEku = $pfxSigningCertificate.Extensions |
            Where-Object {
              $_ -is [Security.Cryptography.X509Certificates.X509EnhancedKeyUsageExtension]
            } |
            ForEach-Object { $_.EnhancedKeyUsages } |
            Where-Object { $_.Value -eq $codeSigningEku }
          if ($null -eq $hasCodeSigningEku) {
            throw "The Windows signing certificate has no code-signing EKU."
          }

          $securePassword = ConvertTo-SecureString `
            $env:WINDOWS_SIGNING_CERTIFICATE_PASSWORD `
            -AsPlainText `
            -Force
          Write-Host "Importing the private signing identity"
          $importedCertificates = @(
            Import-PfxCertificate `
              -FilePath $pfxPath `
              -CertStoreLocation Cert:\CurrentUser\My `
              -Password $securePassword
          )
          $signingCertificate = $importedCertificates |
            Where-Object { $_.HasPrivateKey } |
            Select-Object -First 1
          if ($null -eq $signingCertificate) {
            throw "The Windows signing P12 did not contain an importable private key."
          }

          if ($signingCertificate.Thumbprint -ne $expectedCertificateSha1) {
            throw "The Windows signing P12 does not match the pinned SHA-1 store identity."
          }

          # CI trusts only this exact leaf temporarily so SignTool, Inno signcheck,
          # installation, and uninstall verification can exercise the signed files.
          # The certificate is never installed on an end user's machine.
          Write-Host "Adding temporary noninteractive certificate trust"
          foreach ($storeName in @("Root", "TrustedPublisher")) {
            & certutil.exe -user -f -addstore $storeName $certificatePath
            if ($LASTEXITCODE -ne 0) {
              throw "certutil failed to add the signing certificate to $storeName."
            }
          }

          $signTool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object { [Version]$_.Directory.Parent.Name } -Descending |
            Select-Object -First 1
          if ($null -eq $signTool) {
            throw "A compatible x64 SignTool was not found."
          }

          "PAUSELY_SIGNTOOL_PATH=$($signTool.FullName)" >> $env:GITHUB_ENV
          "PAUSELY_WINDOWS_CERTIFICATE_SHA256=$expectedCertificateSha256" >> $env:GITHUB_ENV

      - name: Sign and verify Windows app
        shell: pwsh
        run: |
          ./scripts/Sign-WindowsArtifact.ps1 -FilePath out/PauselyWindows.exe
          ./scripts/Verify-WindowsSignature.ps1 `
            -FilePath out/PauselyWindows.exe `
            -ExpectedSha256 $env:PAUSELY_WINDOWS_CERTIFICATE_SHA256

      - name: Create compatibility update archive
        shell: pwsh
        run: Compress-Archive -Path out/PauselyWindows.exe -DestinationPath Pausely-Windows.zip

      - name: Install verified Inno Setup compiler
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $innoVersion = "6.7.3"
          $innoTag = "is-6_7_3"
          $innoAssetName = "innosetup-$innoVersion.exe"
          $innoInstaller = Join-Path $env:RUNNER_TEMP $innoAssetName

          gh release download $innoTag `
            --repo jrsoftware/issrc `
            --pattern $innoAssetName `
            --dir $env:RUNNER_TEMP `
            --clobber
          gh release verify-asset $innoTag $innoInstaller --repo jrsoftware/issrc

          $innoSignature = Get-AuthenticodeSignature -LiteralPath $innoInstaller
          if ($innoSignature.Status -ne [System.Management.Automation.SignatureStatus]::Valid) {
            throw "The downloaded Inno Setup compiler has invalid Authenticode status '$($innoSignature.Status)'."
          }
          if ($innoSignature.SignerCertificate.Subject -notmatch 'CN=Pyrsys B\.V\.') {
            throw "Unexpected Inno Setup publisher '$($innoSignature.SignerCertificate.Subject)'."
          }

          $innoDirectory = Join-Path $env:RUNNER_TEMP "InnoSetup"
          $process = Start-Process `
            -FilePath $innoInstaller `
            -ArgumentList @(
              "/VERYSILENT",
              "/SUPPRESSMSGBOXES",
              "/NORESTART",
              "/SP-",
              "/DIR=`"$innoDirectory`""
            ) `
            -Wait `
            -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Inno Setup installation failed with exit code $($process.ExitCode)."
          }

          $isccPath = Join-Path $innoDirectory "ISCC.exe"
          if (-not (Test-Path -LiteralPath $isccPath -PathType Leaf)) {
            throw "ISCC.exe was not installed at $isccPath."
          }
          "PAUSELY_ISCC_PATH=$isccPath" >> $env:GITHUB_ENV

      - name: Build signed Windows installer
        shell: pwsh
        run: |
          $sourceDirectory = (Resolve-Path "out").Path
          $outputDirectory = Join-Path $env:GITHUB_WORKSPACE "installer-out"
          New-Item -ItemType Directory -Path $outputDirectory -Force | Out-Null
          $signingScript = (Resolve-Path "scripts/Sign-WindowsArtifact.ps1").Path
          $signCommand = 'powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $q' +
            $signingScript +
            '$q $f'

          & $env:PAUSELY_ISCC_PATH `
            "/DAppVersion=$env:VERSION" `
            "/DSourceDir=$sourceDirectory" `
            "/DOutputDir=$outputDirectory" `
            "/SPauselySign=$signCommand" `
            "PauselyWindows/installer/Pausely.iss"
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup compilation failed with exit code $LASTEXITCODE."
          }

      - name: Verify and smoke-test Windows installer
        shell: pwsh
        run: |
          $setupPath = "installer-out/Pausely-Windows-Setup.exe"
          ./scripts/Verify-WindowsSignature.ps1 `
            -FilePath $setupPath `
            -ExpectedSha256 $env:PAUSELY_WINDOWS_CERTIFICATE_SHA256

          $smokeDirectory = Join-Path $env:RUNNER_TEMP "PauselySmoke"
          $installProcess = Start-Process `
            -FilePath (Resolve-Path $setupPath).Path `
            -ArgumentList @(
              "/VERYSILENT",
              "/SUPPRESSMSGBOXES",
              "/NORESTART",
              "/NOICONS",
              "/SP-",
              "/DIR=`"$smokeDirectory`""
            ) `
            -Wait `
            -PassThru
          if ($installProcess.ExitCode -ne 0) {
            throw "Installer smoke test failed with exit code $($installProcess.ExitCode)."
          }

          $installedApp = Join-Path $smokeDirectory "PauselyWindows.exe"
          $uninstaller = Join-Path $smokeDirectory "unins000.exe"
          ./scripts/Verify-WindowsSignature.ps1 `
            -FilePath $installedApp `
            -ExpectedSha256 $env:PAUSELY_WINDOWS_CERTIFICATE_SHA256
          ./scripts/Verify-WindowsSignature.ps1 `
            -FilePath $uninstaller `
            -ExpectedSha256 $env:PAUSELY_WINDOWS_CERTIFICATE_SHA256

          $installedVersion = (Get-Item $installedApp).VersionInfo.FileVersion
          if (-not $installedVersion.StartsWith($env:VERSION)) {
            throw "Installed version '$installedVersion' does not match '$env:VERSION'."
          }

          $initialAppProcess = Start-Process `
            -FilePath $installedApp `
            -WorkingDirectory $smokeDirectory `
            -PassThru
          Start-Sleep -Seconds 3
          if ($initialAppProcess.HasExited) {
            throw "The installed application exited during its launch smoke test."
          }

          $autoUpdateProcess = Start-Process `
            -FilePath (Resolve-Path $setupPath).Path `
            -ArgumentList @(
              "/VERYSILENT",
              "/SUPPRESSMSGBOXES",
              "/NORESTART",
              "/CLOSEAPPLICATIONS",
              "/SP-",
              "/PAUSELYAUTOUPDATE=1",
              "/PAUSELYRUNNINGEXE=`"$installedApp`"",
              "/DIR=`"$smokeDirectory`""
            ) `
            -Wait `
            -PassThru
          if ($autoUpdateProcess.ExitCode -ne 0) {
            throw "Automatic-update reinstall failed with exit code $($autoUpdateProcess.ExitCode)."
          }

          $relaunchedApp = $null
          for ($attempt = 0; $attempt -lt 15 -and $null -eq $relaunchedApp; $attempt++) {
            Start-Sleep -Seconds 1
            $relaunchedApp = Get-Process -Name "PauselyWindows" -ErrorAction SilentlyContinue |
              Where-Object {
                try {
                  $_.MainModule.FileName -eq (Resolve-Path $installedApp).Path -and
                    $_.Id -ne $initialAppProcess.Id
                }
                catch {
                  $false
                }
              } |
              Select-Object -First 1
          }
          if ($null -eq $relaunchedApp) {
            throw "Automatic update did not close and relaunch the installed application."
          }
          if (-not $initialAppProcess.HasExited) {
            throw "Automatic update relaunched the application without closing the original process."
          }
          Stop-Process -Id $relaunchedApp.Id -Force
          Wait-Process -Id $relaunchedApp.Id -ErrorAction SilentlyContinue

          $portableDirectory = Join-Path $env:RUNNER_TEMP "Pausely Portable Smoke"
          New-Item -ItemType Directory -Path $portableDirectory -Force | Out-Null
          $portableApp = Join-Path $portableDirectory "PauselyWindows.exe"
          Copy-Item -LiteralPath "out/PauselyWindows.exe" -Destination $portableApp

          $portableProcess = Start-Process `
            -FilePath $portableApp `
            -WorkingDirectory $portableDirectory `
            -PassThru
          Start-Sleep -Seconds 3
          if ($portableProcess.HasExited) {
            throw "The portable bridge application exited during its launch smoke test."
          }

          $migrationProcess = Start-Process `
            -FilePath (Resolve-Path $setupPath).Path `
            -ArgumentList @(
              "/VERYSILENT",
              "/SUPPRESSMSGBOXES",
              "/NORESTART",
              "/CLOSEAPPLICATIONS",
              "/SP-",
              "/PAUSELYAUTOUPDATE=1",
              "/PAUSELYRUNNINGEXE=`"$portableApp`"",
              "/DIR=`"$smokeDirectory`""
            ) `
            -Wait `
            -PassThru
          if ($migrationProcess.ExitCode -ne 0) {
            throw "Portable-to-installer migration failed with exit code $($migrationProcess.ExitCode)."
          }

          $migratedApp = $null
          for ($attempt = 0; $attempt -lt 15 -and $null -eq $migratedApp; $attempt++) {
            Start-Sleep -Seconds 1
            $migratedApp = Get-Process -Name "PauselyWindows" -ErrorAction SilentlyContinue |
              Where-Object {
                try {
                  $_.MainModule.FileName -eq (Resolve-Path $installedApp).Path
                }
                catch {
                  $false
                }
              } |
              Select-Object -First 1
          }
          if ($null -eq $migratedApp) {
            throw "Portable migration did not launch the installer-managed application."
          }
          if (-not $portableProcess.HasExited) {
            throw "Portable migration left the original portable application running."
          }

          $remainingPauselyProcesses = @(
            Get-Process -Name "PauselyWindows" -ErrorAction SilentlyContinue
          )
          if ($remainingPauselyProcesses.Count -ne 1 -or
              $remainingPauselyProcesses[0].Id -ne $migratedApp.Id) {
            throw "Portable migration did not leave exactly one installer-managed Pausely process."
          }
          Stop-Process -Id $migratedApp.Id -Force
          Wait-Process -Id $migratedApp.Id -ErrorAction SilentlyContinue

          $uninstallProcess = Start-Process `
            -FilePath $uninstaller `
            -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART") `
            -Wait `
            -PassThru
          if ($uninstallProcess.ExitCode -ne 0) {
            throw "Silent uninstall failed with exit code $($uninstallProcess.ExitCode)."
          }

          for ($attempt = 0; $attempt -lt 10 -and (Test-Path $installedApp); $attempt++) {
            Start-Sleep -Seconds 1
          }
          if (Test-Path $installedApp) {
            throw "Silent uninstall left the installed application behind."
          }

          Copy-Item `
            -LiteralPath (Resolve-Path $setupPath).Path `
            -Destination "Pausely-Windows-Setup.exe"

          foreach ($storeName in @("Root", "TrustedPublisher")) {
            $certificatePath = (
              "Cert:\CurrentUser\$storeName\" +
              $env:PAUSELY_WINDOWS_CERTIFICATE_SHA1
            )
            if (Test-Path -LiteralPath $certificatePath) {
              Remove-Item -LiteralPath $certificatePath -Force
            }
            if (Test-Path -LiteralPath $certificatePath) {
              throw "The Windows signing certificate remained in $storeName after removal."
            }
          }

          $verificationProcess = Start-Process `
            -FilePath "out/PauselyWindows.exe" `
            -ArgumentList @(
              "--verify-update-signature",
              "`"$(Resolve-Path $setupPath)`""
            ) `
            -Wait `
            -PassThru
          if ($verificationProcess.ExitCode -ne 0) {
            throw "The updater rejected the authentic pinned installer without OS root trust."
          }

          $tamperedSetup = Join-Path $env:RUNNER_TEMP "Pausely-Windows-Tampered.exe"
          Copy-Item -LiteralPath $setupPath -Destination $tamperedSetup
          $tamperedStream = [IO.File]::Open(
            $tamperedSetup,
            [IO.FileMode]::Open,
            [IO.FileAccess]::ReadWrite,
            [IO.FileShare]::None
          )
          try {
            $tamperedStream.Position = 4096
            $originalByte = $tamperedStream.ReadByte()
            if ($originalByte -lt 0) {
              throw "Could not read the installer byte selected for the tamper test."
            }
            $tamperedStream.Position = 4096
            $tamperedStream.WriteByte($originalByte -bxor 0x01)
          }
          finally {
            $tamperedStream.Dispose()
          }

          $tamperVerificationProcess = Start-Process `
            -FilePath "out/PauselyWindows.exe" `
            -ArgumentList @(
              "--verify-update-signature",
              "`"$tamperedSetup`""
            ) `
            -Wait `
            -PassThru
          if ($tamperVerificationProcess.ExitCode -eq 0) {
            throw "The updater accepted a tampered installer."
          }

      - name: Remove temporary Windows signing material
        if: always()
        shell: pwsh
        run: |
          $certificateSha1 = $env:PAUSELY_WINDOWS_CERTIFICATE_SHA1
          if ([string]::IsNullOrWhiteSpace($certificateSha1)) {
            $certificateSha1 = "E729BC983B9B5A1F145103066D43FC53A58D6C57"
          }

          $myCertificatePath = "Cert:\CurrentUser\My\$certificateSha1"
          if (Test-Path -LiteralPath $myCertificatePath) {
            Remove-Item -LiteralPath $myCertificatePath -DeleteKey -Force
          }
          foreach ($storeName in @("Root", "TrustedPublisher")) {
            $certificatePath = "Cert:\CurrentUser\$storeName\$certificateSha1"
            if (Test-Path -LiteralPath $certificatePath) {
              Remove-Item -LiteralPath $certificatePath -Force
            }
          }

          $pfxPath = $env:PAUSELY_WINDOWS_SIGNING_PFX
          if ([string]::IsNullOrWhiteSpace($pfxPath)) {
            $pfxPath = Join-Path $env:RUNNER_TEMP "pausely-windows-release-signing.p12"
          }
          Remove-Item `
            -LiteralPath $pfxPath `
            -Force `
            -ErrorAction SilentlyContinue

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Pausely-Windows
          path: |
            Pausely-Windows-Setup.exe
            Pausely-Windows.zip

  create-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: release-publish-${{ github.ref }}
      cancel-in-progress: false
    needs: [build-macos, build-windows]
    permissions:
      contents: write
    steps:
      - name: Download macOS artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Pausely-macOS

      - name: Download Windows artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Pausely-Windows

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Release v1.0.${{ github.run_number }}
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            Pausely-macOS.dmg
            Pausely-macOS.zip
            appcast.xml
            Pausely-Windows-Setup.exe
            Pausely-Windows.zip
          generate_release_notes: true
