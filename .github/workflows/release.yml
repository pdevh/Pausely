name: Release pipeline

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      candidate_version:
        description: Strict MAJOR.MINOR.PATCH version to validate without publishing
        required: true
        default: "1.0.6"
        type: string

permissions:
  contents: read

concurrency:
  group: >-
    ${{ github.ref_type == 'tag'
      && format('release-{0}', github.ref_name)
      || github.event_name == 'workflow_dispatch'
      && format('candidate-{0}', github.run_id)
      || format('validation-{0}', github.ref) }}
  cancel-in-progress: >-
    ${{ github.ref_type != 'tag' && github.event_name != 'workflow_dispatch' }}

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  metadata:
    name: Resolve release mode
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      signed: ${{ steps.metadata.outputs.signed }}
      publish: ${{ steps.metadata.outputs.publish }}
      mode: ${{ steps.metadata.outputs.mode }}
    steps:
      - name: Validate event and derive version
        id: metadata
        shell: bash
        env:
          CANDIDATE_VERSION: ${{ inputs.candidate_version }}
        run: |
          set -euo pipefail
          semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          tag_semver="^v${semver:1}"

          case "$GITHUB_EVENT_NAME" in
            workflow_dispatch)
              version="$CANDIDATE_VERSION"
              signed=true
              publish=false
              mode=candidate
              ;;
            push)
              if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
                [[ "$GITHUB_REF_NAME" =~ $tag_semver ]] || {
                  echo "Refusing non-release tag '$GITHUB_REF_NAME'." >&2
                  exit 1
                }
                version="${GITHUB_REF_NAME#v}"
                signed=true
                publish=true
                mode=release
              else
                version=0.0.0
                signed=false
                publish=false
                mode=validation
              fi
              ;;
            pull_request)
              version=0.0.0
              signed=false
              publish=false
              mode=validation
              ;;
            *)
              echo "Unsupported release event '$GITHUB_EVENT_NAME'." >&2
              exit 1
              ;;
          esac

          [[ "$version" =~ $semver ]] || {
            echo "Version '$version' is not strict MAJOR.MINOR.PATCH." >&2
            exit 1
          }
          {
            echo "version=$version"
            echo "signed=$signed"
            echo "publish=$publish"
            echo "mode=$mode"
          } >> "$GITHUB_OUTPUT"

  build-macos:
    name: Build macOS (${{ needs.metadata.outputs.mode }})
    needs: metadata
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0, node24
        with:
          persist-credentials: false

      - name: Prepare persistent macOS signing identity
        if: needs.metadata.outputs.signed == 'true'
        timeout-minutes: 3
        env:
          MACOS_SIGNING_CERTIFICATE: ${{ secrets.MACOS_SIGNING_CERTIFICATE }}
          MACOS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_SIGNING_CERTIFICATE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$MACOS_SIGNING_CERTIFICATE"
          test -n "$MACOS_SIGNING_CERTIFICATE_PASSWORD"

          certificate_path="$RUNNER_TEMP/pausely-release-signing.p12"
          keychain_path="$RUNNER_TEMP/pausely-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          public_certificate=".github/signing/Pausely-Release-Certificate.pem"

          printf '%s' "$MACOS_SIGNING_CERTIFICATE" | base64 -D > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -P "$MACOS_SIGNING_CERTIFICATE_PASSWORD" \
            -f pkcs12 \
            -k "$keychain_path" \
            -A
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"
          sudo -n security add-trusted-cert \
            -d \
            -r trustRoot \
            -p codeSign \
            -k /Library/Keychains/System.keychain \
            "$public_certificate"
          security list-keychains -d user -s "$keychain_path"

          certificate_sha1="$(
            openssl x509 -in "$public_certificate" -noout -fingerprint -sha1 |
              cut -d= -f2 |
              tr -d ':'
          )"
          signing_identity="$(
            security find-identity -v -p codesigning "$keychain_path" |
              awk '/Pausely GitHub Release Signing/{print $2; exit}'
          )"
          test -n "$signing_identity"
          test "$signing_identity" = "$certificate_sha1"
          {
            echo "CODE_SIGN_IDENTITY=$signing_identity"
            echo "CODE_SIGN_KEYCHAIN=$keychain_path"
            echo "CODE_SIGN_CERTIFICATE_SHA1=$certificate_sha1"
            echo "PAUSELY_SIGNING_CERTIFICATE_SHA1=$(printf '%s' "$certificate_sha1" | tr '[:upper:]' '[:lower:]')"
          } >> "$GITHUB_ENV"

      - name: Build, verify, and package signed macOS candidate
        if: needs.metadata.outputs.signed == 'true'
        timeout-minutes: 35
        env:
          GH_TOKEN: ${{ github.token }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          chmod +x build.sh scripts/Build-MacOSRelease.sh
          ./scripts/Build-MacOSRelease.sh \
            "${{ needs.metadata.outputs.version }}" \
            signed

      - name: Build, verify, and package unsigned macOS validation
        if: needs.metadata.outputs.signed != 'true'
        timeout-minutes: 35
        shell: bash
        run: |
          set -euo pipefail
          chmod +x build.sh scripts/Build-MacOSRelease.sh
          ./scripts/Build-MacOSRelease.sh \
            "${{ needs.metadata.outputs.version }}" \
            unsigned

      - name: Remove temporary macOS signing material
        if: always()
        timeout-minutes: 2
        shell: bash
        run: |
          security delete-keychain \
            "$RUNNER_TEMP/pausely-signing.keychain-db" \
            2>/dev/null || true
          rm -f "$RUNNER_TEMP/pausely-release-signing.p12"

      - name: Upload macOS assets
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1, node24
        with:
          name: macos-release-${{ github.run_id }}
          path: release-assets-macos/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload macOS diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1, node24
        with:
          name: macos-diagnostics-${{ github.run_id }}
          path: release-diagnostics-macos/
          if-no-files-found: warn
          retention-days: 14

  build-windows:
    name: Build Windows (${{ needs.metadata.outputs.mode }})
    needs: metadata
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0, node24
        with:
          persist-credentials: false

      - name: Set up exact .NET SDK
        uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5.3.0, node24
        with:
          dotnet-version: 10.0.302

      - name: Build, sign, and package Windows candidate
        if: needs.metadata.outputs.signed == 'true'
        timeout-minutes: 25
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERTIFICATE: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE }}
          WINDOWS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          ./scripts/Build-WindowsRelease.ps1 `
            -Version '${{ needs.metadata.outputs.version }}' `
            -Signed

      - name: Build and package unsigned Windows validation
        if: needs.metadata.outputs.signed != 'true'
        timeout-minutes: 25
        shell: pwsh
        run: |
          ./scripts/Build-WindowsRelease.ps1 `
            -Version '${{ needs.metadata.outputs.version }}'

      - name: Exercise signed install, update, launch, and uninstall
        if: needs.metadata.outputs.signed == 'true'
        timeout-minutes: 15
        shell: pwsh
        env:
          PAUSELY_WINDOWS_SIGNING_PFX: ${{ runner.temp }}\pausely-windows-release-signing.pfx
          PAUSELY_WINDOWS_SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          ./scripts/Test-WindowsReleaseLifecycle.ps1 `
            -Version '${{ needs.metadata.outputs.version }}' `
            -Signed

      - name: Exercise unsigned install, update, launch, and uninstall
        if: needs.metadata.outputs.signed != 'true'
        timeout-minutes: 15
        shell: pwsh
        run: |
          ./scripts/Test-WindowsReleaseLifecycle.ps1 `
            -Version '${{ needs.metadata.outputs.version }}'

      - name: Record Windows runner diagnostics
        if: always()
        timeout-minutes: 2
        shell: pwsh
        run: |
          New-Item release-diagnostics -ItemType Directory -Force | Out-Null
          dotnet --info *>&1 |
            Set-Content release-diagnostics/dotnet-info.txt
          Get-Process |
            Sort-Object ProcessName, Id |
            Format-Table ProcessName, Id, Path -AutoSize |
            Out-String |
            Set-Content release-diagnostics/processes.txt
          foreach ($storeName in @('My', 'Root', 'TrustedPublisher')) {
            Get-ChildItem "Cert:\CurrentUser\$storeName" |
              Select-Object Subject, Thumbprint |
              ConvertTo-Json |
              Set-Content "release-diagnostics/cert-$storeName.json"
          }

      - name: Remove temporary Windows signing material
        if: always()
        timeout-minutes: 2
        shell: pwsh
        run: |
          $pfxPath = Join-Path `
            $env:RUNNER_TEMP `
            'pausely-windows-release-signing.pfx'
          Remove-Item `
            -LiteralPath $pfxPath `
            -Force `
            -ErrorAction SilentlyContinue
          if (Test-Path -LiteralPath $pfxPath) {
            throw 'Temporary Windows signing PFX survived cleanup.'
          }

      - name: Upload Windows assets
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1, node24
        with:
          name: windows-release-${{ github.run_id }}
          path: release-assets/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Windows diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1, node24
        with:
          name: windows-diagnostics-${{ github.run_id }}
          path: release-diagnostics/
          if-no-files-found: warn
          retention-days: 14

  publish:
    name: Publish five-asset release
    if: >-
      ${{ always()
        && needs.metadata.outputs.publish == 'true'
        && needs.build-macos.result == 'success'
        && needs.build-windows.result == 'success' }}
    needs:
      - metadata
      - build-macos
      - build-windows
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout publishing script
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0, node24
        with:
          persist-credentials: false

      - name: Download macOS assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1, node24
        with:
          name: macos-release-${{ github.run_id }}
          path: publish-assets

      - name: Download Windows assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1, node24
        with:
          name: windows-release-${{ github.run_id }}
          path: publish-assets

      - name: Transactionally publish exact release asset set
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          ./scripts/Publish-Release.ps1 `
            -Tag '${{ github.ref_name }}' `
            -AssetDirectory publish-assets
