name: Release Builds

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-macos:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build macOS app
        env:
          VERSION: 1.0.${{ github.run_number }}
        run: |
          chmod +x build.sh
          ./build.sh "$VERSION"

      - name: Verify macOS bundle
        env:
          VERSION: 1.0.${{ github.run_number }}
        run: |
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Pausely.app/Contents/Info.plist)" = "$VERSION"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' Pausely.app/Contents/Info.plist)" = "$VERSION"
          test "$(lipo -archs Pausely.app/Contents/MacOS/Pausely)" = "x86_64 arm64" || test "$(lipo -archs Pausely.app/Contents/MacOS/Pausely)" = "arm64 x86_64"
          codesign --verify --deep --strict Pausely.app

      - name: Package macOS app
        run: ditto -c -k --sequesterRsrc --keepParent Pausely.app Pausely-macOS.zip

      - name: Generate release notes
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: 1.0.${{ github.run_number }}
        run: |
          mkdir sparkle-release
          cp Pausely-macOS.zip sparkle-release/Pausely-macOS.zip
          gh api --method POST "/repos/${GITHUB_REPOSITORY}/releases/generate-notes" -f tag_name="v${VERSION}" -f target_commitish="${GITHUB_SHA}" --jq .body > sparkle-release/Pausely-macOS.md

      - name: Generate signed Sparkle appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          VERSION: 1.0.${{ github.run_number }}
        run: |
          test -n "$SPARKLE_PRIVATE_KEY"
          printf '%s' "$SPARKLE_PRIVATE_KEY" | .build/artifacts/sparkle/Sparkle/bin/generate_appcast \
            --ed-key-file - \
            --download-url-prefix "https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}/" \
            --link "https://github.com/${GITHUB_REPOSITORY}/releases/tag/v${VERSION}" \
            --embed-release-notes \
            --maximum-versions 1 \
            --maximum-deltas 0 \
            -o appcast.xml \
            sparkle-release
          test -s appcast.xml

      - name: Verify appcast contents
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          VERSION: 1.0.${{ github.run_number }}
        run: |
          grep -q "<sparkle:version>$VERSION</sparkle:version>" appcast.xml
          grep -q "releases/download/v${VERSION}/Pausely-macOS.zip" appcast.xml
          grep -q "sparkle:edSignature=" appcast.xml
          grep -q "sparkle-signatures:" appcast.xml
          printf '%s' "$SPARKLE_PRIVATE_KEY" | .build/artifacts/sparkle/Sparkle/bin/sign_update \
            --verify \
            --ed-key-file - \
            appcast.xml

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pausely-macOS
          path: |
            Pausely-macOS.zip
            appcast.xml

  build-windows:
    runs-on: windows-2025
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish Windows app
        run: |
          dotnet publish PauselyWindows/PauselyWindows.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:Version=1.0.${{ github.run_number }} -p:FileVersion=1.0.${{ github.run_number }} -o out

      - name: Zip Windows app
        run: Compress-Archive -Path out\* -DestinationPath Pausely-Windows.zip

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pausely-Windows
          path: Pausely-Windows.zip

  create-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [build-macos, build-windows]
    permissions:
      contents: write
    steps:
      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: Pausely-macOS

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: Pausely-Windows

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Release v1.0.${{ github.run_number }}
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            Pausely-macOS.zip
            appcast.xml
            Pausely-Windows.zip
          generate_release_notes: true
