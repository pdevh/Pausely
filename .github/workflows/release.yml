name: Release Builds

on:
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build macOS app
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Zip macOS app
        run: zip -r Pausely-macOS.zip Pausely.app

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pausely-macOS
          path: Pausely-macOS.zip

  build-windows:
    runs-on: windows-2025
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish Windows app
        run: |
          dotnet publish PauselyWindows/PauselyWindows.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o out

      - name: Zip Windows app
        run: Compress-Archive -Path out\* -DestinationPath Pausely-Windows.zip

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pausely-Windows
          path: Pausely-Windows.zip

  create-release:
    runs-on: ubuntu-latest
    needs: [build-macos, build-windows]
    permissions:
      contents: write
    steps:
      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: Pausely-macOS

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: Pausely-Windows

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Release v1.0.${{ github.run_number }}
          files: |
            Pausely-macOS.zip
            Pausely-Windows.zip
          generate_release_notes: true
